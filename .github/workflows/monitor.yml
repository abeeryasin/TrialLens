name: Monitor tracked trials

# Runs every 6 hours, unattended, plus a manual "Run workflow" button for
# testing. This is what turns ingest.py from something a human runs by hand
# into a real scheduled job (see docs/decisions.md, 2026-08-28).
#
# The API is started fresh inside this job (not called over the internet)
# because there's no permanently-deployed FastAPI instance yet — that's a
# later, separate step (see docs/roadmap.md, step 9). Running it ephemerally
# here, exactly like local dev does, keeps "FastAPI is the only door to the
# database" true without requiring a public deployment before this job can
# exist. DATABASE_URL / DATABASE_URL_READONLY only ever live in this job's
# environment via GitHub's encrypted secrets — never in a public endpoint.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      drift_checks:
        description: "Also run the upstream data-drift checks (~56 MB of Neon transfer)"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start FastAPI (this job only, torn down when it ends)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"
          cat api.log
          exit 1

      # DATABASE_URL is needed here as well as by the API step above:
      # run_monitor.py opens its own connection to write the monitor_runs
      # record (step 7b direction 3) and to store prose interpretations
      # (step 7c). Locally those are invisible because load_dotenv reads
      # .env.local; in this job the environment is the only source, and
      # without this the script dies on KeyError: 'DATABASE_URL' before the
      # first condition is ingested.
      #
      # ANTHROPIC_API_KEY is optional. Without it, step 7c's interpretation
      # call fails inside run_prose_interpretation's except clause and the
      # monitor job continues — the intended degradation. With it, spend is
      # bounded twice: PROSE_BUDGET_USD per run, and a rolling 30-day ceiling
      # read from monitor_runs.prose_spend_usd, because a per-run cap alone
      # says nothing about what four runs a day add up to.
      - name: Run the Monitor job
        env:
          API_BASE_URL: http://127.0.0.1:8000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_monitor.py

      # The graph is a snapshot and the ingest above keeps moving, so a trial
      # ingested since the last backfill has no edges at all until this runs.
      # Run #3 on 2026-09-02 ingested 174 changes and left the graph behind;
      # it was caught by reconciliation rather than by anything automatic.
      # This is the "stop being a manual step" that
      # test_the_graph_is_not_behind_the_studies_it_describes asks for.
      #
      # Safe to run every time: every write is idempotent, and on a quiet run
      # it is a ~30s no-op reporting 0 rows changed. It also runs the
      # delisting pass, so a site a trial dropped this cycle is stamped now
      # rather than whenever someone remembers.
      #
      # `if: always()` for the same reason as the drift checks below — a
      # partial ingest is exactly when the graph most needs reconciling, and
      # the backfill only ever reads what is actually on file.
      #
      # Note this is a direct-DB script inside a repeating flow, which is the
      # §5 tension run_monitor.py already carries. Routing the rebuild
      # through FastAPI is the cleaner end state and is deferred, not denied.
      - name: Rebuild the Explore graph from what was just ingested
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_graph_entities.py

      # Immediately after the backfill, never before it: the merge points
      # near-duplicate rows at a canonical one, and the rows it has to
      # consider are the ones the backfill just inserted. Skipping it lets
      # duplicates accumulate silently — a new spelling of a hospital
      # becomes a new site, and Explore quietly stops seeing two trials as
      # sharing it. Idempotent, so a run with nothing new changes nothing.
      - name: Merge near-duplicate entities
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/merge_entities.py

      # Data-drift checks, run here rather than in tests.yml on purpose.
      # These assert things about what ClinicalTrials.gov actually sends —
      # that every intervention type is one we know, that every stored age
      # parses, that a trial's changes still group into amendments the way
      # the endpoint assumes. None of that changes when someone edits code;
      # it changes when the upstream data does. So they belong on the data's
      # schedule, not on every push.
      #
      # WEEKLY until 2026-09-26, then twice a day (see the date in the script
      # below — it flips itself). The billing period runs 26 Aug -> 26 Sep and
      # was at 82% on 2026-09-07 with ~840 MB left over 18 days, i.e. ~47 MB a
      # day. Twice-daily checks are 112 MB a day: they would have exhausted the
      # allowance around 16 September, and Neon's free tier SUSPENDS THE COMPUTE
      # when transfer runs out — the deployed site would have gone dark, which
      # matters because it is being shown to potential employers.
      #
      # TWICE A DAY, not every tick (2026-09-08). The real-data half of the
      # suite pulls 56 MB from Neon per run, and this job fires four times a
      # day: 29 runs since the step was added on 2026-09-02 is ~1.6 GB, on a
      # free tier that allows 5 GB of transfer a month. Yesterday's bandwidth
      # postmortem blamed local test runs and undercounted this one.
      #
      # Upstream data does not drift on a six-hour cadence — CT.gov posting a
      # thirteenth intervention type is a weekly-to-monthly event. Halving it
      # to the 00:0x and 12:0x ticks costs at most 12 hours of detection
      # latency and saves ~112 MB a day (224 -> 112). A manual dispatch runs
      # it only when asked (`drift_checks: true`), because the usual reason to
      # dispatch this job is to make the INGEST run now — paying 56 MB for
      # drift checks nobody asked for would put the cost straight back.
      #
      # `if: always()` so it still runs when the ingest above failed — a
      # failed ingest is exactly when you want to know whether the data
      # changed shape underneath it.
      - name: Check for upstream data drift
        if: always()
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          PYTHONPATH: .
        run: |
          HOUR=$(date -u +%H)   # 01 and 13 are accepted alongside 00 and 12 so a
          DOW=$(date -u +%u)    # late scheduler does not silently skip a slot.
          TODAY=$(date -u +%F)

          # The cadence restores itself. Until the billing period resets there
          # is not enough transfer left for twice-daily checks (see the header);
          # after it, there is. Writing that as a comment saying "remember to
          # put this back" is how it would quietly stay weekly for a year —
          # this project has a standing rule that a comment describing an
          # invariant is not the invariant, so the date is in the code.
          BILLING_RESET=2026-09-26
          if [ "$TODAY" \< "$BILLING_RESET" ]; then
            WINDOW="weekly"   # Mondays only
            case "$DOW:$HOUR" in 1:00|1:01) DUE=yes ;; *) DUE=no ;; esac
          else
            WINDOW="twice daily"
            case "$HOUR" in 00|01|12|13) DUE=yes ;; *) DUE=no ;; esac
          fi
          if [ "${{ github.event.inputs.drift_checks }}" = "true" ]; then
            DUE=yes
          fi

          if [ "$DUE" != "yes" ]; then
            echo "Skipping drift checks: cadence is ${WINDOW} (now ${TODAY}"
            echo "${HOUR}:xx UTC, day ${DOW}). The real-data suite pulls ~56 MB"
            echo "from Neon, and the free tier suspends the compute when the"
            echo "5 GB monthly allowance runs out. Weekly until the billing"
            echo "period resets on ${BILLING_RESET}, twice daily after that."
            echo "To force one now, dispatch this workflow with"
            echo "drift_checks = true."
            exit 0
          fi
          pip install -r requirements-dev.txt
          pytest tests/ -q -rs

      # Escalation (step 11, 2026-09-06). Everything above can pass while
      # the system is quietly not working: an emptied tracked_conditions
      # table produces a green run that checks zero trials, and a step 7c
      # failure is caught by design and only printed. This step reads
      # GET /ops/status and FAILS THE JOB on a critical alert, so GitHub's
      # own failure notification becomes the alarm — no email provider, no
      # extra secret, no new thing that can itself break.
      #
      # `if: always()` because a failed ingest is exactly when the health
      # verdict matters. Warnings do not fail it (scripts/check_ops_health.py).
      - name: Check autonomous-ops health, and escalate if it is bad
        if: always()
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: python scripts/check_ops_health.py

      - name: Show API log on failure
        if: failure()
        run: cat api.log

name: Monitor tracked trials

# Runs every 6 hours, unattended, plus a manual "Run workflow" button for
# testing. This is what turns ingest.py from something a human runs by hand
# into a real scheduled job (see docs/decisions.md, 2026-08-28).
#
# The API is started fresh inside this job (not called over the internet)
# because there's no permanently-deployed FastAPI instance yet — that's a
# later, separate step (see docs/roadmap.md, step 9). Running it ephemerally
# here, exactly like local dev does, keeps "FastAPI is the only door to the
# database" true without requiring a public deployment before this job can
# exist. DATABASE_URL / DATABASE_URL_READONLY only ever live in this job's
# environment via GitHub's encrypted secrets — never in a public endpoint.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start FastAPI (this job only, torn down when it ends)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"
          cat api.log
          exit 1

      # DATABASE_URL is needed here as well as by the API step above:
      # run_monitor.py opens its own connection to write the monitor_runs
      # record (step 7b direction 3) and to store prose interpretations
      # (step 7c). Locally those are invisible because load_dotenv reads
      # .env.local; in this job the environment is the only source, and
      # without this the script dies on KeyError: 'DATABASE_URL' before the
      # first condition is ingested.
      #
      # ANTHROPIC_API_KEY is optional. Without it, step 7c's interpretation
      # call fails inside run_prose_interpretation's except clause and the
      # monitor job continues — the intended degradation. With it, spend is
      # bounded twice: PROSE_BUDGET_USD per run, and a rolling 30-day ceiling
      # read from monitor_runs.prose_spend_usd, because a per-run cap alone
      # says nothing about what four runs a day add up to.
      - name: Run the Monitor job
        env:
          API_BASE_URL: http://127.0.0.1:8000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_monitor.py

      # The graph is a snapshot and the ingest above keeps moving, so a trial
      # ingested since the last backfill has no edges at all until this runs.
      # Run #3 on 2026-09-02 ingested 174 changes and left the graph behind;
      # it was caught by reconciliation rather than by anything automatic.
      # This is the "stop being a manual step" that
      # test_the_graph_is_not_behind_the_studies_it_describes asks for.
      #
      # Safe to run every time: every write is idempotent, and on a quiet run
      # it is a ~30s no-op reporting 0 rows changed. It also runs the
      # delisting pass, so a site a trial dropped this cycle is stamped now
      # rather than whenever someone remembers.
      #
      # `if: always()` for the same reason as the drift checks below — a
      # partial ingest is exactly when the graph most needs reconciling, and
      # the backfill only ever reads what is actually on file.
      #
      # Note this is a direct-DB script inside a repeating flow, which is the
      # §5 tension run_monitor.py already carries. Routing the rebuild
      # through FastAPI is the cleaner end state and is deferred, not denied.
      - name: Rebuild the Explore graph from what was just ingested
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_graph_entities.py

      # Data-drift checks, run here rather than in tests.yml on purpose.
      # These assert things about what ClinicalTrials.gov actually sends —
      # that every intervention type is one we know, that every stored age
      # parses, that a trial's changes still group into amendments the way
      # the endpoint assumes. None of that changes when someone edits code;
      # it changes when the upstream data does. So they belong on the data's
      # schedule, immediately after the ingest that would introduce the
      # drift, not on every push.
      #
      # `if: always()` so they still run when the ingest above failed — a
      # failed ingest is exactly when you want to know whether the data
      # changed shape underneath it.
      - name: Check for upstream data drift
        if: always()
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          PYTHONPATH: .
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ -q -rs

      - name: Show API log on failure
        if: failure()
        run: cat api.log
